<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shoes Product Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .product-card {
      width: 380px;
      background: #fff;
      border: 3px solid #ff6600;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2), 
                  0 5px 10px rgba(255,102,0,0.3);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 35px rgba(0,0,0,0.25), 
                  0 8px 15px rgba(255,102,0,0.4);
    }

    .product-card img {
      width: 100%;
      height: auto;
      display: block;
      border-bottom: 2px solid #ff6600;
    }

    .product-card h2 {
      color: #ff6600;
      margin: 15px 0 5px;
      font-size: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .price {
      display: inline-block;
      background: linear-gradient(90deg, #ffeb3b, #ffc107);
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 20px;
      margin: 12px 0;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }

    .description {
      font-size: 15px;
      color: #444;
      padding: 0 25px 20px;
      line-height: 1.5;
    }

    /* Optional: Add a subtle glow effect */
    .product-card:hover h2 {
      text-shadow: 0 0 8px rgba(255,102,0,0.6);
    }
  </style>
</head>
<body>
  <div class="product-card">
    <img src="https://row.barkershoes.com/cdn/shop/collections/c9de6e9bd9195ba8b4ce02dcc7138b6a_600x375_crop_center.jpg?v=1632492625" alt="Stylish Shoes">
    <h2>Shoes</h2>
    <div class="price">₹3000</div>
    <p class="description">Premium leather shoes crafted for comfort and elegance, designed to make every step stylish and confident.</p>
  </div>
</body>
</html>
