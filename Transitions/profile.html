<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile Card</title>
  <link href="profile.css" rel="stylesheet">
</head>
<body>
  <div class="profile-card">
    <div class="profile-image">
      <img src="https://www.pngitem.com/pimgs/m/277-2778082_bramble-bear-making-fists-bablu-dablu-photo-download.png" alt="Profile" />

      <span class="online-dot" aria-hidden="true"></span>
    </div>
    <div class="profile-name">Dablu</div>
    <div class="profile-role">Bhaluuu Developer</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number">100</div>
        <div class="stat-label">Fishes</div>
      </div>
      <div class="stat">
        <div class="stat-number">1M</div>
        <div class="stat-label">Fans</div>
      </div>
      <div class="stat">
        <div class="stat-number">20</div>
        <div class="stat-label">Girl Friends</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-follow">Follow</button>
      <button class="btn btn-message">Message</button>
    </div>
  </div>
</body>
</html>
