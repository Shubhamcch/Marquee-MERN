<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            width: 100px;
            height: 100px;
            background-color: red;

            /* Transition */
            transition-property: all;
            transition-duration: 1s;
            transition-delay: 0s;
            
            /* shorthand we can use this one line instead of above three */
            transition: all 1s 0s ease-in;


        }
        #box:hover{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>
