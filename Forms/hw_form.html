<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Application Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border: 1px solid #ccc;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .section-title {
      background: #222;
      color: #fff;
      padding: 8px 12px;
      margin: 25px 0 15px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 14px;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
    }

    .form-group {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group label {
      min-width: 120px;
      font-size: 14px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="date"],
    .form-group input[type="tel"] {
      width: 100%;
      border: none;
      border-bottom: 1px solid #999;
      padding: 5px;
      outline: none;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .checkbox-group label {
      min-width: auto;
    }

    .full-width {
      width: 100%;
    }

    textarea {
      width: 100%;
      border: 1px solid #ccc;
      padding: 10px;
      resize: vertical;
    }

    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>JOB APPLICATION FORM</h1>

    <!-- PERSONAL INFORMATION -->
    <div class="section-title">Personal Information</div>

    <div class="form-row">
      <div class="form-group">
        <label>Name:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Date of Birth:</label>
        <input type="date">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Address:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>City, State:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Email Address:</label>
        <input type="email">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phone Number:</label>
        <input type="tel">
      </div>

      <div class="form-group">
        <label>S.S.N:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Position Applied For:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>Date Available:</label>
        <input type="date">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Desired Pay:</label>

        <input type="checkbox"> Hour
        <input type="checkbox"> Salary
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Employment Desired:</label>

        <input type="checkbox"> Full Time
        <input type="checkbox"> Part Time
        <input type="checkbox"> Seasonal
      </div>
    </div>

    <!-- EMPLOYMENT ELIGIBILITY -->
    <div class="section-title">Employment Eligibility</div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Legally Eligible to Work in U.S.?</label>

        <input type="checkbox"> Yes
        <input type="checkbox"> No
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Worked for this Employer Before?</label>

        <input type="checkbox"> Yes
        <input type="checkbox"> No
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>If Yes, Start & End Dates:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Ever Convicted of a Felony?</label>

        <input type="checkbox"> Yes
        <input type="checkbox"> No
      </div>
    </div>

    <div class="form-row">
      <div class="form-group full-width">
        <label>If Yes, Please Explain:</label>
      </div>
    </div>

    <textarea rows="4"></textarea>

    <!-- EDUCATION -->
    <div class="section-title">Education</div>

    <!-- High School -->
    <div class="form-row">
      <div class="form-group">
        <label>High School:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>City / State:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>From:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>To:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Graduate?</label>

        <input type="checkbox"> Yes
        <input type="checkbox"> No
      </div>

      <div class="form-group">
        <label>Diploma:</label>
        <input type="text">
      </div>
    </div>

    <!-- College -->
    <div class="form-row">
      <div class="form-group">
        <label>College:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>City / State:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>From:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>To:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>Graduate?</label>

        <input type="checkbox"> Yes
        <input type="checkbox"> No
      </div>

      <div class="form-group">
        <label>Diploma:</label>
        <input type="text">
      </div>
    </div>

    <!-- Other Education -->
    <div class="form-row">
      <div class="form-group">
        <label>Other:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>City / State:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>From:</label>
        <input type="text">
      </div>

      <div class="form-group">
        <label>To:</label>
        <input type="text">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Degree / Certification:</label>
        <input type="text">
      </div>
    </div>

  </div>

</body>
</html>
