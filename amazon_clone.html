<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon"
    href="https://vignette.wikia.nocookie.net/logopedia/images/f/fc/Amazon.com_Favicon_2.svg/revision/latest?cb=20160808095346"
    type="image/x-icon">
    <title>Online Shopping site in India</title>
    <style>
        #navbar-top {
            background-color: rgb(19,25,23);
            color: white;
            padding: 10px 20px;
            width: 100%;
            height: 40px;
        }
        #navbar-bottom {
            background-color: rgb(35,47,62);
            color: white;
            padding: 10px 20px;
            width: 100%;
            height: 35px;
        }
    </style>
</head>
<body>
    <header>
        <section id="navbar-top">
            <nav>
                <a href="https://www.amazon.in/" target="_blank">Amazon</a>
                <img 
                src="https://www.svgrepo.com/show/452153/amazon-pay.svg"
                alt="Amazon Pay"
                width="80px"
                >
            </nav>
        </section>
        <section id="navbar-bottom">
            <nav></nav>
        </section>
    </header>
    
</body>
</html>
