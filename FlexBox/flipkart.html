<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Top Bar</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f2f2f2;
    }

    .topbar{
      width:100%;
      height:70px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:350px;
      padding:0 40px;
    }

    /* LEFT BUTTONS */

    .left{
      display:flex;
      gap:15px;
    }

    .btn{
      padding:10px 22px;
      border:none;
      border-radius:10px;
      background:#d9d9d9;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .active{
      background:#ffe500;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    /* LOCATION */

    .location{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:15px;
      font-weight:500;
    }

  </style>

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

  <div class="topbar">

    <!-- LEFT SIDE -->
    <div class="left">

      <button class="btn active">
        ✅ Flipkart
      </button>

      <button class="btn">
        ✈️ Travel
      </button>

    </div>

    <!-- RIGHT SIDE -->
    <div class="location">
      <i class="fa-solid fa-location-dot"></i>
      <span>Location : Vadodara</span>
    </div>

  </div>

</body>
</html>
